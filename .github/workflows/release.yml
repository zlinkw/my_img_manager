name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 Git 标签"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag and manifest version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $manifest = Get-Content -Raw -Encoding UTF8 manifest.json | ConvertFrom-Json
          if ($env:TAG_NAME -ne "v$($manifest.version)") {
            throw "Tag $($env:TAG_NAME) does not match manifest version $($manifest.version)."
          }
      - name: Install dependencies
        run: npm.cmd install --no-audit --no-fund
      - name: Validate and build XPI
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Release
      - name: Collect release assets
        id: assets
        shell: pwsh
        run: |
          $xpi = Get-ChildItem -LiteralPath outputs -Filter 'pdf-image-saver-*.xpi' |
            Where-Object { $_.BaseName -match '^pdf-image-saver-\d+\.\d+\.\d+$' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $xpi) { throw 'Stable release XPI was not built.' }
          $sha = "$($xpi.FullName).sha256"
          if (-not (Test-Path -LiteralPath $sha -PathType Leaf)) { throw 'SHA256 sidecar was not built.' }
          "xpi=$($xpi.FullName)" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          XPI_PATH: ${{ steps.assets.outputs.xpi }}
          SHA_PATH: ${{ steps.assets.outputs.sha }}
        run: |
          gh release create "$env:TAG_NAME" "$env:XPI_PATH" "$env:SHA_PATH" --title "$env:TAG_NAME" --generate-notes
